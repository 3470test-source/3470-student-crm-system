        /* =========================
           MAIN
        ========================= */

        .crm-main {
            margin-left: 245px;
            padding: 95px 28px 30px;
            transition: 0.3s ease;
        }

        .crm-main.expanded {
            margin-left: 0;
        }

        .crm-page-title {
            font-size: 26px;
            font-weight: 700;
            color: #17202a;
            margin-bottom: 6px;
        }

        .crm-page-subtitle {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 25px;
        }

        /* =========================
           CARDS
        ========================= */

        .crm-dashboard-cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
            margin-bottom: 25px;
        }

        .crm-dashboard-card {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
        }

        .crm-card-icon {
            width: 50px;
            height: 50px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 21px;
            background: #dcfce7;
            color: #15803d;
        }

        .crm-card-content h3 {
            font-size: 13px;
            color: #6b7280;
            font-weight: 500;
            margin-bottom: 5px;
        }

        .crm-card-number {
            font-size: 25px;
            font-weight: 700;
            color: #111827;
        }

        /* =========================
           SECTIONS
        ========================= */

        .crm-dashboard-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .crm-section {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            overflow: hidden;
        }

        .crm-section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 17px 20px;
            border-bottom: 1px solid #e5e7eb;
        }

        .crm-section-title {
            font-size: 17px;
            font-weight: 700;
        }

        .crm-view-all {
            color: #15803d;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
        }

        /* =========================
           TABLE
        ========================= */

        .crm-table-wrapper {
            overflow-x: auto;
        }

        .crm-table {
            width: 100%;
            border-collapse: collapse;
        }

        .crm-table th,
        .crm-table td {
            padding: 13px 16px;
            border-bottom: 1px solid #eef0f2;
            text-align: left;
            font-size: 13px;
            white-space: nowrap;
        }

        .crm-table th {
            background: #f8fafc;
            color: #475569;
            font-weight: 600;
        }

        .crm-table td {
            color: #374151;
        }

        .crm-table tr:last-child td {
            border-bottom: none;
        }

        .crm-status {
            display: inline-block;
            padding: 5px 9px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
        }

        .crm-status.pending {
            background: #fef3c7;
            color: #b45309;
        }

        .crm-status.completed {
            background: #dcfce7;
            color: #15803d;
        }

        .crm-status.interested {
            background: #dbeafe;
            color: #1d4ed8;
        }

        /* =========================
           NOTIFICATIONS
        ========================= */

        .crm-notification-list {
            padding: 5px 0;
        }

        .crm-notification-item {
            display: flex;
            gap: 12px;
            padding: 15px 18px;
            border-bottom: 1px solid #eef0f2;
        }

        .crm-notification-item:last-child {
            border-bottom: none;
        }

        .crm-notification-icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #dcfce7;
            color: #15803d;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .crm-notification-text {
            font-size: 13px;
            color: #374151;
            line-height: 1.5;
        }

        .crm-notification-time {
            display: block;
            color: #9ca3af;
            font-size: 11px;
            margin-top: 3px;
        }

        /* =========================
           QUICK ACTIONS
        ========================= */

        .crm-quick-actions {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            padding: 18px;
        }

        .crm-action-btn {
            border: 1px solid #d1d5db;
            background: #ffffff;
            border-radius: 8px;
            padding: 13px;
            cursor: pointer;
            color: #166534;
            font-weight: 600;
            font-size: 13px;
            transition: 0.2s;
        }

        .crm-action-btn:hover {
            background: #f0fdf4;
            border-color: #22c55e;
        }

    /* =========================

    ========================= */

    async function loadEmployeeDashboard() {

        const user = getLoggedInUser();

        if (!user) {
            window.location.href = "login.html";
            return;
        }

        try {

            /*
             * IMPORTANT:
             * Backend must identify the logged-in employee
             * from the authenticated session/JWT.
             *
             * Do not trust a user ID from the frontend
             * for security-sensitive filtering.
             */

            const response = await fetch(
                `${API_BASE}/employee/dashboard`,
                {
                    method: "GET",
                    headers: {
                        "Content-Type": "application/json"
                    }
                }
            );

            if (!response.ok) {

                throw new Error(
                    `Dashboard request failed: ${response.status}`
                );

            }

            const data = await response.json();

            if (!data.success) {

                throw new Error(
                    data.message || "Unable to load dashboard"
                );

            }

            renderDashboard(data);

        } catch (error) {

            console.error(
                "❌ Employee Dashboard Error:",
                error
            );

            showDashboardError(error.message);

        }

    }


    /* =========================
       RENDER DASHBOARD
    ========================= */

    function renderDashboard(data) {

        const summary = data.summary || {};

        document.getElementById("myEnquiriesCount").textContent =
            Number(summary.my_enquiries || 0);

        document.getElementById("todayFollowupsCount").textContent =
            Number(summary.today_followups || 0);

        document.getElementById("myAdmissionsCount").textContent =
            Number(summary.my_admissions || 0);

        document.getElementById("pendingFollowupsCount").textContent =
            Number(summary.pending_followups || 0);


        renderFollowups(
            data.today_followups || []
        );

        renderEnquiries(
            data.recent_enquiries || []
        );

        renderNotifications(
            data.notifications || []
        );

    }


    /* =========================
       FOLLOWUPS
    ========================= */

    function renderFollowups(followups) {

        const tbody =
            document.getElementById("todayFollowupsTable");

        if (!followups.length) {

            tbody.innerHTML = `
                <tr>
                    <td colspan="5"
                        style="text-align:center;">
                        No follow-ups scheduled for today.
                    </td>
                </tr>
            `;

            return;

        }

        tbody.innerHTML = followups.map(followup => {

            return `
                <tr>

                    <td>
                        ${escapeHtml(followup.student_name || "-")}
                    </td>

                    <td>
                        ${escapeHtml(followup.course || "-")}
                    </td>

                    <td>
                        ${formatTime(followup.follow_up_time)}
                    </td>

                    <td>
                        ${escapeHtml(
                            followup.follow_up_type || "-"
                        )}
                    </td>

                    <td>
                        <span class="crm-status ${getStatusClass(
                            followup.status
                        )}">
                            ${escapeHtml(
                                followup.status || "-"
                            )}
                        </span>
                    </td>

                </tr>
            `;

        }).join("");

    }


    /* =========================
       ENQUIRIES
    ========================= */

    function renderEnquiries(enquiries) {

        const tbody =
            document.getElementById("recentEnquiriesTable");

        if (!enquiries.length) {

            tbody.innerHTML = `
                <tr>
                    <td colspan="5"
                        style="text-align:center;">
                        No enquiries found.
                    </td>
                </tr>
            `;

            return;

        }

        tbody.innerHTML = enquiries.map(enquiry => {

            return `
                <tr>

                    <td>
                        ${escapeHtml(
                            enquiry.student_name || "-"
                        )}
                    </td>

                    <td>
                        ${escapeHtml(
                            enquiry.mobile || "-"
                        )}
                    </td>

                    <td>
                        ${escapeHtml(
                            enquiry.course_interested || "-"
                        )}
                    </td>

                    <td>
                        <span class="crm-status interested">
                            ${escapeHtml(
                                enquiry.status || "-"
                            )}
                        </span>
                    </td>

                    <td>
                        ${formatDate(
                            enquiry.enquiry_date
                        )}
                    </td>

                </tr>
            `;

        }).join("");

    }


    /* =========================
       NOTIFICATIONS
    ========================= */

    function renderNotifications(notifications) {

        const container =
            document.getElementById(
                "dashboardNotifications"
            );

        if (!notifications.length) {

            container.innerHTML = `
                <div class="crm-notification-item">

                    <div class="crm-notification-icon">
                        <i class="fa-solid fa-check"></i>
                    </div>

                    <div class="crm-notification-text">
                        No new notifications.
                    </div>

                </div>
            `;

            return;

        }

        container.innerHTML =
            notifications.slice(0, 5).map(notification => {

                return `
                    <div class="crm-notification-item">

                        <div class="crm-notification-icon">
                            <i class="fa-solid fa-bell"></i>
                        </div>

                        <div class="crm-notification-text">

                            ${escapeHtml(
                                notification.message ||
                                "New notification"
                            )}

                            <span class="crm-notification-time">
                                ${formatDateTime(
                                    notification.created_at
                                )}
                            </span>

                        </div>

                    </div>
                `;

            }).join("");

    }


    /* =========================
       HEADER NOTIFICATION COUNT
    ========================= */

    async function loadNotificationCount() {

        const count =
            document.getElementById(
                "headerNotificationCount"
            );

        try {

            const response = await fetch(
                `${API_BASE}/notifications/today`
            );

            const data = await response.json();

            if (
                response.ok &&
                data.success &&
                data.summary
            ) {

                count.textContent =
                    Number(
                        data.summary.total_notifications || 0
                    );

            }

        } catch (error) {

            console.error(
                "❌ Notification Count Error:",
                error
            );

            count.textContent = "0";

        }

    }


    /* =========================
       OPEN NOTIFICATIONS
    ========================= */

    function openNotifications() {

        window.location.href =
            "my-notifications.html";

    }


    /* =========================
       LOGOUT
    ========================= */

    function logoutEmployee(event) {

        event.preventDefault();

        localStorage.removeItem("crmUser");
        localStorage.removeItem("crmToken");

        window.location.href = "login.html";

    }


    /* =========================
       STATUS
    ========================= */

    function getStatusClass(status) {

        if (!status) {
            return "pending";
        }

        const value =
            status.toLowerCase();

        if (
            value === "completed" ||
            value === "admission confirmed"
        ) {

            return "completed";

        }

        return "pending";

    }


    /* =========================
       DATE
    ========================= */

    function formatDate(value) {

        if (!value) {
            return "-";
        }

        const date = new Date(value);

        if (Number.isNaN(date.getTime())) {
            return value;
        }

        return date.toLocaleDateString("en-IN");

    }


    /* =========================
       TIME
    ========================= */

    function formatTime(value) {

        if (!value) {
            return "-";
        }

        const parts = String(value).split(":");

        if (parts.length < 2) {
            return value;
        }

        let hour = Number(parts[0]);
        const minute = parts[1];

        const suffix =
            hour >= 12 ? "PM" : "AM";

        hour = hour % 12 || 12;

        return `${hour}:${minute} ${suffix}`;

    }


    /* =========================
       DATE + TIME
    ========================= */

    function formatDateTime(value) {

        if (!value) {
            return "";
        }

        const date = new Date(value);

        if (Number.isNaN(date.getTime())) {
            return "";
        }

        return date.toLocaleString("en-IN");

    }


    /* =========================
       HTML SECURITY
    ========================= */

    function escapeHtml(value) {

        return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }


    /* =========================

                </td>
            </tr>

                    ${escapeHtml(message)}
                </div>

            </div>
        `;

    }
