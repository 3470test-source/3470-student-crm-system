                <!-- Student Enquiries -->
                <div class="crm-dropdown">

                    </div>

                    <div class="crm-dropdown-content">
                        <a href="add-enquiry.html"><i class="fa fa-user-plus"></i>Add Enquiry</a>
                        <a href="my-enquiries.html"><i class="fa fa-users"></i>Manage Enquiries</a>

                    <div class="crm-dropdown-content">

                        <a href="my-follow-ups.html"><i class="fa-solid fa-phone"></i>My Follow-ups</a>
                    </div>

                <div class="crm-dropdown">

                        <i class="fa fa-user-check"></i>Admissions
                        <i class="fa fa-angle-down icon-color"></i>
                    </div>

                    <div class="crm-dropdown-content">
                        <a href="new-admission.html"><i class="fa fa-plus-circle"></i>New Admission</a>
                        <a href="my-admissions.html"><i class="fa-solid fa-user-check"></i>My Admissions</a>
                    </div>

                <a href="my-notifications.html" class="crm-nav-link EMP-active">

            <!-- Employee Edit Enquiry -->
            <main class="EMP-dashboard-main">

                <div class="emp-edit-enqyiry-heading">

                    <div>
                        <h1>Edit Enquiry</h1>
                        <p>Update an existing student enquiry.</p>
                    </div>

                    <button class="emp-btn-editEnquiry emp-secondary-editEnquiry" id="backButton"><i class="fa-solid fa-arrow-left"></i> Back</button>
                </div>

                <div id="formMessage" class="message hidden" role="status"></div>
                <div id="loading" class="emp-edit-Enquiry-card">Loading enquiry...</div>


                <form id="editEnquiryForm" class="hidden">

                    <!-- Student Information -->
                    <section class="emp-edit-Enquiry-card">
                        <h3>Student Information</h3>

                            <div class="emp-edit-Enquiry-grid">

                                <!-- STUDENT NAME -->
                                <div class="emp-field-EditEnq">
                                    <label for="student_name">STUDENT NAME <span>*</span></label>
                                    <input id="student_name" name="student_name" required maxlength="150">

                                <!-- MOBILE NUMBER -->

                                </div>

                                <!-- EMAIL -->

                                        <option value="Female">Female</option>

                                </div>

                                </div>

                                <!-- COURSE INTERESTED -->
                                <div class="emp-field-EditEnq">
                                    <label for="course_interested">COURSE INTERESTED <span>*</span></label>
                                    <input id="course_interested" name="course_interested" required maxlength="150">
                                </div>

                                <!-- ENQUIRY SOURCE -->
                                <div class="emp-field-EditEnq">
                                    <label for="enquiry_source">ENQUIRY SOURCE</label>
                                    <select id="enquiry_source" name="enquiry_source">
                                        <option value="">Select source</option>
                                        <option value="Website">Website</option>
                                        <option value="Phone Call">Phone Call</option>
                                        <option value="Walk-in">Walk-in</option>
                                        <option value="WhatsApp">WhatsApp</option>
                                        <option value="Facebook">Facebook</option>
                                        <option value="Instagram">Instagram</option>
                                        <option value="Referral">Referral</option>
                                        <option value="Other">Other</option>
                                    </select>
                                </div>

                                <!-- COUNSELLOR -->
                                <div class="emp-field-EditEnq">
                                    <label for="counsellor">COUNSELLOR</label>
                                    <input id="counsellor" name="counsellor" type="text" readonly>
                                </div>

                                <!-- ENQUIRY DATE -->
                                <div class="emp-field-EditEnq">
                                    <label for="enquiry_date">ENQUIRY DATE</label>
                                    <input id="enquiry_date" name="enquiry_date" type="date">
                                </div>

                                <!-- ENQUIRY STATUS -->
                                <div class="emp-field-EditEnq">
                                    <label for="status">ENQUIRY STATUS <span>*</span></label>
                                    <select id="status" name="status" required>
                                        <option value="New">New</option>
                                        <option value="Pending">Pending</option>
                                        <option value="Interested">Interested</option>
                                        <option value="Not Interested">Not Interested</option>
                                        <option value="Call Back">Call Back</option>
                                        <option value="Follow-up">Follow-up</option>

                                    </select>
                                </div>

                                <!-- FOLLOW-UP DATE -->

                                </div>

                                <!-- FOLLOW-UP TIME -->

                                    <label for="follow_up_time">FOLLOW-UP TIME</label>

<!-- Employee Edit Enquiry - JS -->
<script>

(() => {

    const API_BASE = "http://localhost:3000/api";
    const $ = id => document.getElementById(id);
    let enquiryId = null;
    let redirectTimer = null;

    function getUser() {
        try {
            return JSON.parse(localStorage.getItem("crmUser") || "null");
        } catch {
            return null;
        }
    }

    function logout() {
        localStorage.removeItem("crmToken");
        localStorage.removeItem("crmUser");
        window.location.replace("login.html");
    }

    function showMessage(message, type = "error") {
        const box = $("formMessage");
        box.textContent = message;
        box.className = `message ${type}`;
    }

    function hideMessage() {
        $("formMessage").className = "message hidden";
        $("formMessage").textContent = "";
    }

    function dateForInput(value) {
        if (!value) return "";
        const s = String(value).slice(0, 10);
        return /^\d{4}-\d{2}-\d{2}$/.test(s) ? s : "";
    }

    function timeForInput(value) {
        if (!value) return "";
        return String(value).slice(0, 5);
    }

    function setValue(id, value) {
        $(id).value = value === null || value === undefined
            ? ""
            : String(value);
    }

    function fillForm(a) {
        setValue("student_name", a.student_name);
        setValue("mobile", a.mobile);
        setValue("email", a.email);
        setValue("gender", a.gender);
        setValue("date_of_birth", dateForInput(a.date_of_birth));
        setValue("course_interested", a.course_interested);
        setValue("enquiry_source", a.enquiry_source);
        setValue("counsellor", a.counsellor);
        setValue("enquiry_date", dateForInput(a.enquiry_date));
        setValue("follow_up_date", dateForInput(a.follow_up_date));
        setValue("follow_up_time", timeForInput(a.follow_up_time));
        setValue("status", a.status || "New");
        setValue("address", a.address);
        setValue("comments", a.comments);
        $("loading").classList.add("hidden");
        $("editEnquiryForm").classList.remove("hidden");
    }

    async function loadEnquiry() {
        const token = localStorage.getItem("crmToken");
        const user = getUser();

        if (!token || !user) {
            logout();
            return;
        }

        const role = String(user.role ?? user.user_role ?? "").toLowerCase();

        if (role === "admin") {
            window.location.replace("dashboard-crm.html");
            return;
        }

        if (!["counsellor", "staff"].includes(role)) {
            $("loading").classList.add("hidden");
            showMessage("You do not have permission to edit this enquiry.");
            return;
        }

        enquiryId = new URLSearchParams(location.search).get("id");

        if (!enquiryId || !/^\d+$/.test(enquiryId)) {
            $("loading").classList.add("hidden");
            showMessage("Invalid enquiry ID.");
            return;
        }

        try {
            const response = await fetch(
                `${API_BASE}/employee/enquiries/${encodeURIComponent(enquiryId)}`,
                {
                    headers: {
                        "Accept": "application/json",
                        "Authorization": `Bearer ${token}`
                    }
                }
            );

            const data = await response.json().catch(() => ({}));

            if (response.status === 401) {
                logout();
                return;
            }

            if (!response.ok || data.success === false) {
                throw new Error(data.message || `Request failed (${response.status}).`);
            }

            const record = data.enquiry ?? data.data;

            if (!record) throw new Error("Enquiry data was not returned.");

            fillForm(record);

        } catch (error) {
            console.error("Load enquiry error:", error);
            $("loading").classList.add("hidden");
            showMessage(error.message || "Unable to load enquiry.");
        }
    }

    async function updateEnquiry(event) {
        event.preventDefault();
        hideMessage();

        if (!$("editEnquiryForm").reportValidity()) return;

        const token = localStorage.getItem("crmToken");

        if (!token) {
            logout();
            return;
        }

        const mobile = $("mobile").value.trim();

        if (!/^\d{10}$/.test(mobile)) {
            showMessage("Mobile number must contain exactly 10 digits.");
            $("mobile").focus();
            return;
        }

        const payload = {
            student_name: $("student_name").value.trim(),
            mobile,
            email: $("email").value.trim(),
            gender: $("gender").value,
            date_of_birth: $("date_of_birth").value,
            course_interested: $("course_interested").value.trim(),
            enquiry_source: $("enquiry_source").value,
            enquiry_date: $("enquiry_date").value,
            follow_up_date: $("follow_up_date").value,
            follow_up_time: $("follow_up_time").value,
            status: $("status").value,
            address: $("address").value.trim(),
            comments: $("comments").value.trim()
        };

        const button = $("saveButton");
        button.disabled = true;
        button.textContent = "Updating...";

        try {
            const response = await fetch(
                `${API_BASE}/employee/enquiries/${encodeURIComponent(enquiryId)}`,
                {
                    method: "PUT",
                    headers: {
                        "Content-Type": "application/json",
                        "Accept": "application/json",
                        "Authorization": `Bearer ${token}`
                    },
                    body: JSON.stringify(payload)
                }
            );

            const data = await response.json().catch(() => ({}));

            if (response.status === 401) {
                logout();
                return;
            }

            if (!response.ok || data.success === false) {
                throw new Error(
                    data.message || data.error || `Update failed (${response.status}).`
                );
            }

            showMessage(
                data.message || "Enquiry updated successfully!",
                "success"
            );

            button.textContent = "Updated successfully";

            /*--- Redirect after 5 seconds. ---*/
            redirectTimer = setTimeout(() => {
                window.location.href = "my-enquiries.html";
            }, 3500);

            } catch (error) {
                console.error("Update enquiry error:", error);
                showMessage(error.message || "Unable to update enquiry.", "error");
                button.disabled = false;
                button.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> Update Enquiry';
            }
        }

    
        async function loadNotificationCount() {
        const token = localStorage.getItem("crmToken");
        const countElement = $("headerNotificationCount");

        if (!countElement) return;

        if (!token) {
            countElement.textContent = "0";
            return;
        }

        try {
        const response = await fetch(`${API_BASE}/employee/notifications`,
            {
                headers: {
                    "Accept": "application/json",
                    "Authorization": `Bearer ${token}`
                }
            }
        );

        if (response.status === 401) {
            logout();
            return;
        }

        const data = await response.json();

        if (!response.ok || data.success === false) {
            console.error("Notification API error:", data.message);
            return;
        }

        const notifications = Array.isArray(data.notifications)
            ? data.notifications
            : Array.isArray(data.data)
                ? data.data
                : [];

        const count =
            data.summary?.total_notifications ??
            data.total_notifications ??
            notifications.length;

        countElement.textContent = String(Number(count) || 0);

            } catch (error) {
                console.error("Notification count error:", error);
            }
        }


        function goBack() {
            if (redirectTimer) clearTimeout(redirectTimer);
            window.location.href = "my-enquiries.html";
        }

    
    document.addEventListener("DOMContentLoaded", () => {
    const user = getUser();

    /*-- Employee name, role and avatar --*/
    if (user) {
        const name =
            user.full_name ||
            user.fullName ||
            user.name ||
            user.username ||
            "Employee";

        const role =
            user.role ||
            user.user_role ||
            user.designation ||
            "Employee";

        $("employeeName").textContent = name;
        $("employeeRole").textContent = role;

        $("profileAvatar").textContent =
            name.trim().charAt(0).toUpperCase() || "E";
    }

    /*-- Form buttons --*/
    $("editEnquiryForm").addEventListener("submit", updateEnquiry);
    $("backButton").addEventListener("click", goBack);
    $("cancelButton").addEventListener("click", goBack);

    /*-- Notification navigation --*/
    const notification = document.querySelector(".EMP-notification");

    if (notification) {
        notification.addEventListener("click", () => {
            window.location.href = "my-notifications.html";
        });

        notification.removeAttribute("onclick");
    }

    /*-- Logout confirmation --*/
    $("logoutButton").addEventListener("click", event => {
        event.preventDefault();

        if (confirm("Are you sure you want to log out?")) {
            logout();
        }
    });


    /*-- Load API data --*/
    loadNotificationCount();
    loadEnquiry();
});

})();

</script>
